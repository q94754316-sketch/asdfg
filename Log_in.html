    <!DOCTYPE html>
    <html>
    <head>
    <title>GameVerse Login</title>

    <style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#FF0000,#00C2FF);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .login-box{
        background:white;
        padding:30px;
        border-radius:20px;
        width:300px;
        text-align:center;
        box-shadow:0 0 30px rgba(0,0,0,0.3);
    }

    .login-box h2{
        color:#5386e3;
    }

    input{
        width:90%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:10px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        background:#e92107;
        color:white;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#bf25d6;
        box-shadow:0 0 20px rgb(79, 143, 143);
    }

    a{
        text-decoration:none;
    }

.back-btn {
    position: fixed;
    top: 155px;
    left: 450px;
}
    
    </style>

    </head>
    <body>

    <div class="login-box">
        <h2>Login Account</h2>
<a href="E:\GAMES\Index\index.html" class="back-btn">⬅ Back</a>
        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Log in</button>

            <p><a href="#">Forgot Password?</a></p>
            <p>Don't have an account? <a href="#">Register</a></p>
        </form>
    </div>



    </body>
    </html>
